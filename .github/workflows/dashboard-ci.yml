# ==============================================================================
# @file       .github/workflows/dashboard-ci.yml
# @brief      CI/CD Pipeline — Web Dashboard Team
# @company    Gestell Company
# @copyright  Copyright (c) 2026, Gestell Company. All rights reserved.
#
# Triggers:
#   - pull_request to: master, da_develop
#
# Jobs:
#   1. lint      — ESLint code quality check
#   2. build     — Production build of the web dashboard
#   3. test      — Run unit/integration tests (if configured)
# ==============================================================================

name: "Dashboard CI"

on:
  pull_request:
    branches:
      - master
      - da_develop
    paths:
      - "Dashboard/**"

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Lint
  # ============================================================================
  lint:
    name: "dashboard/lint"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Dashboard/package-lock.json

      - name: "Install dependencies"
        working-directory: Dashboard
        run: npm ci

      - name: "Run ESLint"
        working-directory: Dashboard
        run: npm run lint

  # ============================================================================
  # Job 2: Build
  # ============================================================================
  build:
    name: "dashboard/build"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Dashboard/package-lock.json

      - name: "Install dependencies"
        working-directory: Dashboard
        run: npm ci

      - name: "Build production bundle"
        working-directory: Dashboard
        run: npm run build

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist-${{ github.sha }}
          path: Dashboard/dist/
          retention-days: 30

  # ============================================================================
  # Job 3: Test
  # ============================================================================
  test:
    name: "dashboard/test"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Dashboard/package-lock.json

      - name: "Install dependencies"
        working-directory: Dashboard
        run: npm ci

      - name: "Run tests"
        working-directory: Dashboard
        run: npm test -- --passWithNoTests
